# ==========================================
# APPLICATION
# ==========================================

spring.application.name=online-banking

server.port=${PORT:8080}


# ==========================================
# DATABASE - PostgreSQL
# ==========================================

spring.datasource.url=${DB_URL:jdbc:postgresql://host.docker.internal:5432/online_banking}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345678}
spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# CONNECTION POOL
# ==========================================

spring.datasource.hikari.maximum-pool-size=10

spring.datasource.hikari.minimum-idle=2

spring.datasource.hikari.connection-timeout=30000


# ==========================================
# JWT
# ==========================================

jwt.secret=${JWT_SECRET:change-this-secret-key-for-local-development-only}

jwt.expiration=86400000


# ==========================================
# CORS
# ==========================================

app.cors.allowed-origins=http://localhost:5173


# ==========================================
# LOGGING
# ==========================================

logging.level.org.springframework=INFO

logging.level.com.example.online.banking=INFO

logging.level.org.hibernate.SQL=DEBUG