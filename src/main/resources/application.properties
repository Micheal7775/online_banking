# =========================================================
# APPLICATION
# =========================================================

spring.application.name=online-banking

server.port=${PORT:8080}

server.shutdown=graceful


# =========================================================
# DATABASE - POSTGRESQL
# =========================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# HIKARI CONNECTION POOL
# =========================================================

spring.datasource.hikari.pool-name=OnlineBankingHikariPool

spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}

spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}

spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}

spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}

spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

spring.jpa.open-in-view=true

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=false


# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}

jwt.expiration=${JWT_EXPIRATION:86400000}


# =========================================================
# CORS
# =========================================================

app.cors.allowed-origins=${CORS_ORIGIN}


# =========================================================
# LOGGING
# =========================================================

logging.level.root=INFO

logging.level.com.example.online.banking=INFO

logging.level.org.springframework.security=INFO

logging.level.org.hibernate.SQL=WARN


# =========================================================
# ACTUATOR / MANAGEMENT
# =========================================================

management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=never

# =========================================================
# CORS
# =========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

